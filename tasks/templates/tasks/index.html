{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 44px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
    }

    .topbar-title {
      font-size: 14px;
      font-weight: 600;
      color: #111827;
    }

    .app {
      display: flex;
      gap: 16px;
      padding: 16px;
      flex: 1;
      overflow: hidden;
    }

    .panel {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
    }

    .panel-header {
      padding: 16px 20px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 15px;
      font-weight: 600;
      color: #111827;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* ── Task list ─────────────────────────── */
    .task-panel {
      transition: flex 0.3s ease, min-width 0.3s ease;
      min-width: 0;
    }

    .task-panel.minimised {
      flex: 0 0 40px;
    }

    .task-panel.minimised .task-add,
    .task-panel.minimised .task-list {
      display: none;
    }

    .task-panel.minimised .panel-header {
      padding: 0;
      justify-content: center;
      border-bottom: none;
      height: 100%;
      align-items: flex-start;
      padding-top: 12px;
    }

    .task-panel.minimised #task-panel-title {
      display: none;
    }

    .task-add {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid #e5e7eb;
      flex-shrink: 0;
    }

    .task-add input {
      flex: 1;
      padding: 7px 11px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
      background: inherit;
      color: inherit;
    }

    .task-add input:focus { border-color: #6366f1; }

    .task-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      transition: background 0.1s;
    }

    .task-item:hover { background: #f9fafb; }
    .task-item.drag-over { background: #eef2ff; border-top: 2px solid #6366f1; }

    .drag-handle {
      color: #c4c9d4;
      cursor: grab;
      font-size: 16px;
      line-height: 1;
      user-select: none;
      flex-shrink: 0;
    }

    .drag-handle:active { cursor: grabbing; }

    .task-title {
      flex: 1;
      font-size: 14px;
      color: #374151;
    }

    .task-title-input {
      flex: 1;
      font-size: 14px;
      padding: 2px 7px;
      border: 1px solid #6366f1;
      border-radius: 4px;
      outline: none;
      font-family: inherit;
      background: inherit;
      color: inherit;
    }

    .task-actions { display: flex; gap: 2px; flex-shrink: 0; }

    /* ── Chat panel ────────────────────────── */
    .chat-panel {
      flex: 1.5;
      flex-direction: row;
      gap: 0;
    }

    /* ── Conversations sidebar ─────────────── */
    .convos-sidebar {
      width: 168px;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .convos-header {
      padding: 14px 12px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 13px;
      font-weight: 600;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .convos-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }

    .convo-item {
      padding: 8px 12px;
      font-size: 13px;
      color: #374151;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.1s;
    }

    .convo-item:hover { background: #f9fafb; }
    .convo-item.active { background: #eef2ff; color: #4338ca; font-weight: 500; }

    /* ── Main chat area ────────────────────── */
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 78%;
      padding: 9px 13px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background: #6366f1;
      color: #fff;
      border-bottom-right-radius: 3px;
    }

    .message.assistant {
      align-self: flex-start;
      background: #f3f4f6;
      color: #111827;
      border-bottom-left-radius: 3px;
    }

    .chat-input-row {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid #e5e7eb;
      flex-shrink: 0;
    }

    .chat-input {
      flex: 1;
      padding: 8px 11px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      resize: none;
      outline: none;
      font-family: inherit;
      line-height: 1.4;
      background: inherit;
      color: inherit;
    }

    .chat-input:focus { border-color: #6366f1; }

    /* ── Buttons ───────────────────────────── */
    .btn {
      padding: 7px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      transition: opacity 0.15s, background 0.15s;
    }

    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: #6366f1; color: #fff; }
    .btn-primary:not(:disabled):hover { background: #4f46e5; }
    .btn-icon {
      background: transparent;
      color: #9ca3af;
      padding: 4px 6px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-icon:hover { background: #f3f4f6; color: #374151; }
    .btn-icon.danger:hover { background: #fef2f2; color: #ef4444; }
    .btn-new {
      background: transparent;
      border: none;
      cursor: pointer;
      color: #6366f1;
      font-size: 18px;
      line-height: 1;
      padding: 0 2px;
      border-radius: 4px;
    }
    .btn-new:hover { background: #eef2ff; }

    /* ── Dark mode ─────────────────────────── */
    body.dark {
      background: #0f1117;
    }

    body.dark .topbar {
      background: #1a1d27;
      border-color: #2e3147;
    }

    body.dark .topbar-title { color: #e5e7eb; }

    body.dark .panel {
      background: #1a1d27;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }

    body.dark .panel-header {
      border-color: #2e3147;
      color: #e5e7eb;
    }

    body.dark .task-add {
      border-color: #2e3147;
    }

    body.dark .task-add input,
    body.dark .task-title-input {
      border-color: #3a3f55;
      color: #e5e7eb;
      background: #1a1d27;
    }

    body.dark .task-add input:focus,
    body.dark .task-title-input:focus { border-color: #6366f1; }

    body.dark .task-item:hover { background: #22263a; }
    body.dark .task-item.drag-over { background: #2a2d4a; }

    body.dark .drag-handle { color: #4b5268; }

    body.dark .task-title { color: #d1d5db; }

    body.dark .convos-sidebar { border-color: #2e3147; }

    body.dark .convos-header {
      border-color: #2e3147;
      color: #e5e7eb;
    }

    body.dark .convo-item { color: #9ca3af; }
    body.dark .convo-item:hover { background: #22263a; }
    body.dark .convo-item.active { background: #2a2d4a; color: #818cf8; }

    body.dark .message.assistant {
      background: #22263a;
      color: #e5e7eb;
    }

    body.dark .chat-input-row { border-color: #2e3147; }

    body.dark .chat-input {
      border-color: #3a3f55;
      color: #e5e7eb;
      background: #1a1d27;
    }

    body.dark .chat-input:focus { border-color: #6366f1; }

    body.dark .btn-icon { color: #6b7280; }
    body.dark .btn-icon:hover { background: #22263a; color: #d1d5db; }
    body.dark .btn-icon.danger:hover { background: #2d1f1f; color: #f87171; }

    body.dark .btn-new:hover { background: #2a2d4a; }

    /* ── Console panel ──────────────────────────── */
    .console-panel {
      background: #1a1d27;
      border-top: 1px solid #2e3147;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      transition: height 0.25s ease;
      height: 160px;
    }

    .console-panel.collapsed {
      height: 32px;
    }

    .console-header {
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      flex-shrink: 0;
      cursor: pointer;
      user-select: none;
    }

    .console-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .console-badge {
      background: #6366f1;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      min-width: 16px;
      height: 16px;
      border-radius: 8px;
      padding: 0 4px;
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .console-badge.visible { display: flex; }

    .console-toggle {
      background: transparent;
      border: none;
      color: #4b5268;
      cursor: pointer;
      font-size: 12px;
      padding: 2px 4px;
      border-radius: 3px;
      line-height: 1;
    }

    .console-toggle:hover { color: #9ca3af; }

    .console-body {
      flex: 1;
      overflow-y: auto;
      padding: 6px 12px 8px;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 12px;
      line-height: 1.6;
    }

    .console-panel.collapsed .console-body { display: none; }

    .console-line {
      display: flex;
      gap: 10px;
      color: #a5b4fc;
    }

    .console-line .console-ts {
      color: #4b5268;
      flex-shrink: 0;
    }

    .console-line .console-msg { color: #c4c9d4; word-break: break-word; }

    .console-empty {
      color: #4b5268;
      font-style: italic;
    }

    body.dark .console-panel { border-color: #2e3147; }
  </style>
</head>
<body>
{% csrf_token %}

<div class="topbar">
  <span class="topbar-title">Tasks App</span>
  <button class="btn-icon" id="dark-toggle" title="Toggle dark mode" onclick="toggleDark()">☽</button>
</div>

<div class="app">

  <!-- ── Task list ──────────────────────────────── -->
  <div class="panel task-panel" id="task-panel">
    <div class="panel-header">
      <span id="task-panel-title">Tasks</span>
      <button class="btn-icon" id="minimise-btn" title="Minimise" onclick="toggleMinimise()">◀</button>
    </div>
    <div class="task-add">
      <input type="text" id="new-task-input" placeholder="Add a task…" autocomplete="off">
      <button class="btn btn-primary" onclick="addTask()">Add</button>
    </div>
    <div class="task-list" id="task-list"></div>
  </div>

  <!-- ── Chat ──────────────────────────────────── -->
  <div class="panel chat-panel">

    <!-- Conversations sidebar -->
    <div class="convos-sidebar">
      <div class="convos-header">
        Chats
        <button class="btn-new" title="New chat" onclick="newConversation()">+</button>
      </div>
      <div class="convos-list" id="convos-list"></div>
    </div>

    <!-- Main chat -->
    <div class="chat-main">
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-row">
        <textarea class="chat-input" id="chat-input" placeholder="Type a message…" rows="2"></textarea>
        <button class="btn btn-primary" id="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>

  </div>

</div>

<!-- ── Console ──────────────────────────────────────── -->
<div class="console-panel collapsed" id="console-panel">
  <div class="console-header" onclick="toggleConsole()">
    <div class="console-header-left">
      <span>LLM Console</span>
      <span class="console-badge" id="console-badge">0</span>
    </div>
    <button class="console-toggle" id="console-toggle" title="Toggle console">▲</button>
  </div>
  <div class="console-body" id="console-body">
    <span class="console-empty">No messages yet.</span>
  </div>
</div>

<script>
// ── CSRF ───────────────────────────────────────────
const CSRF = document.querySelector('[name=csrfmiddlewaretoken]').value;

function api(url, method = 'GET', body = null) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF },
  };
  if (body !== null) opts.body = JSON.stringify(body);
  return fetch(url, opts).then(r => r.json());
}

// ── Helpers ────────────────────────────────────────
function esc(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── Dark mode ───────────────────────────────────────
function toggleDark() {
  const dark = document.body.classList.toggle('dark');
  document.getElementById('dark-toggle').textContent = dark ? '☀' : '☽';
  localStorage.setItem('dark', dark ? '1' : '');
}

if (localStorage.getItem('dark')) {
  document.body.classList.add('dark');
  document.getElementById('dark-toggle').textContent = '☀';
}

// ── Console ─────────────────────────────────────────
let consoleUnread = 0;

function appendToConsole(message) {
  const body = document.getElementById('console-body');
  const empty = body.querySelector('.console-empty');
  if (empty) empty.remove();

  const now = new Date();
  const ts = now.toTimeString().slice(0, 8);
  const line = document.createElement('div');
  line.className = 'console-line';
  line.innerHTML = `<span class="console-ts">${ts}</span><span class="console-msg">${esc(message)}</span>`;
  body.appendChild(line);
  body.scrollTop = body.scrollHeight;

  const panel = document.getElementById('console-panel');
  if (panel.classList.contains('collapsed')) {
    consoleUnread++;
    const badge = document.getElementById('console-badge');
    badge.textContent = consoleUnread;
    badge.classList.add('visible');
  }
}

function toggleConsole() {
  const panel = document.getElementById('console-panel');
  const btn = document.getElementById('console-toggle');
  const collapsed = panel.classList.toggle('collapsed');
  btn.textContent = collapsed ? '▲' : '▼';
  if (!collapsed) {
    consoleUnread = 0;
    const badge = document.getElementById('console-badge');
    badge.textContent = '0';
    badge.classList.remove('visible');
    document.getElementById('console-body').scrollTop = document.getElementById('console-body').scrollHeight;
  }
}

// ── Minimise task panel ─────────────────────────────
function toggleMinimise() {
  const panel = document.getElementById('task-panel');
  const btn = document.getElementById('minimise-btn');
  const title = document.getElementById('task-panel-title');
  const minimised = panel.classList.toggle('minimised');
  btn.textContent = minimised ? '▶' : '◀';
  btn.title = minimised ? 'Expand' : 'Minimise';
  title.style.display = minimised ? 'none' : '';
  localStorage.setItem('tasks-minimised', minimised ? '1' : '');
}

if (localStorage.getItem('tasks-minimised')) {
  document.getElementById('task-panel').classList.add('minimised');
  document.getElementById('minimise-btn').textContent = '▶';
  document.getElementById('minimise-btn').title = 'Expand';
  document.getElementById('task-panel-title').style.display = 'none';
}

// ── Tasks ──────────────────────────────────────────
let tasks = [];

async function loadTasks() {
  const data = await api('/api/tasks/');
  tasks = data.tasks;
  renderTasks();
}

function renderTasks() {
  const list = document.getElementById('task-list');
  list.innerHTML = '';
  tasks.sort((a, b) => a.order - b.order || a.id - b.id);
  tasks.forEach(task => {
    const item = document.createElement('div');
    item.className = 'task-item';
    item.dataset.id = task.id;
    item.draggable = true;
    item.innerHTML = `
      <span class="drag-handle" title="Drag to reorder">⠿</span>
      <span class="task-title">${esc(task.title)}</span>
      <div class="task-actions">
        <button class="btn btn-icon" title="Edit" onclick="startEdit(${task.id})">✎</button>
        <button class="btn btn-icon danger" title="Delete" onclick="deleteTask(${task.id})">✕</button>
      </div>`;
    attachDragEvents(item);
    list.appendChild(item);
  });
}

async function addTask() {
  const input = document.getElementById('new-task-input');
  const title = input.value.trim();
  if (!title) return;
  const task = await api('/api/tasks/add/', 'POST', { title });
  if (task.error) return;
  tasks.push(task);
  renderTasks();
  input.value = '';
}

document.getElementById('new-task-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTask();
});

function startEdit(id) {
  const item = document.querySelector(`.task-item[data-id="${id}"]`);
  const task = tasks.find(t => t.id === id);
  const titleSpan = item.querySelector('.task-title');
  const input = document.createElement('input');
  input.className = 'task-title-input';
  input.value = task.title;
  titleSpan.replaceWith(input);
  input.focus();
  input.select();

  let committed = false;
  const commit = async () => {
    if (committed) return;
    committed = true;
    const newTitle = input.value.trim();
    if (!newTitle || newTitle === task.title) { renderTasks(); return; }
    const updated = await api(`/api/tasks/${id}/edit/`, 'POST', { title: newTitle });
    if (!updated.error) task.title = updated.title;
    renderTasks();
  };

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') commit();
    if (e.key === 'Escape') { committed = true; renderTasks(); }
  });
  input.addEventListener('blur', commit);
}

async function deleteTask(id) {
  await api(`/api/tasks/${id}/delete/`, 'POST');
  tasks = tasks.filter(t => t.id !== id);
  renderTasks();
}

// ── Drag & Drop ────────────────────────────────────
let dragSrcId = null;

function attachDragEvents(item) {
  item.addEventListener('dragstart', e => {
    dragSrcId = parseInt(item.dataset.id);
    e.dataTransfer.effectAllowed = 'move';
  });

  item.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.task-item').forEach(el => el.classList.remove('drag-over'));
    item.classList.add('drag-over');
  });

  item.addEventListener('dragleave', () => item.classList.remove('drag-over'));

  item.addEventListener('drop', async e => {
    e.preventDefault();
    item.classList.remove('drag-over');
    const dropId = parseInt(item.dataset.id);
    if (dragSrcId === dropId) return;

    const srcIdx = tasks.findIndex(t => t.id === dragSrcId);
    const dstIdx = tasks.findIndex(t => t.id === dropId);
    const [moved] = tasks.splice(srcIdx, 1);
    tasks.splice(dstIdx, 0, moved);
    tasks.forEach((t, i) => t.order = i + 1);

    renderTasks();
    await api('/api/tasks/reorder/', 'POST', tasks.map(t => ({ id: t.id, order: t.order })));
  });

  item.addEventListener('dragend', () => {
    document.querySelectorAll('.task-item').forEach(el => el.classList.remove('drag-over'));
  });
}

// ── Conversations ───────────────────────────────────
let conversations = [];
let currentConversationId = null;

async function loadConversations() {
  const data = await api('/api/conversations/');
  conversations = data.conversations;
  renderConversations();
}

function renderConversations() {
  const list = document.getElementById('convos-list');
  list.innerHTML = '';
  conversations.forEach(c => {
    const item = document.createElement('div');
    item.className = 'convo-item' + (c.id === currentConversationId ? ' active' : '');
    item.dataset.id = c.id;
    item.textContent = c.title;
    item.title = c.title;
    item.onclick = () => selectConversation(c.id);
    list.appendChild(item);
  });
}

async function selectConversation(id) {
  currentConversationId = id;
  renderConversations();
  const data = await api(`/api/conversations/${id}/messages/`);
  const msgs = document.getElementById('chat-messages');
  msgs.innerHTML = '';
  data.messages.forEach(m => appendMessage(m.role, m.content));
}

function newConversation() {
  currentConversationId = null;
  document.getElementById('chat-messages').innerHTML = '';
  renderConversations();
  document.getElementById('chat-input').focus();
}

// ── Chat ───────────────────────────────────────────
function appendMessage(role, text) {
  const div = document.createElement('div');
  div.className = `message ${role}`;
  div.textContent = text;
  document.getElementById('chat-messages').appendChild(div);
  scrollChat();
  return div;
}

function scrollChat() {
  const msgs = document.getElementById('chat-messages');
  msgs.scrollTop = msgs.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const btn = document.getElementById('send-btn');
  const message = input.value.trim();
  if (!message || btn.disabled) return;

  input.value = '';
  btn.disabled = true;

  appendMessage('user', message);
  const assistantDiv = appendMessage('assistant', '');

  try {
    const body = { message };
    if (currentConversationId) body.conversation_id = currentConversationId;

    const response = await fetch('/api/chat/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF },
      body: JSON.stringify(body),
    });

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6);
        if (payload === '[DONE]') break;
        try {
          const data = JSON.parse(payload);
          if (data.conversation_id) {
            currentConversationId = data.conversation_id;
          }
          if (data.text) {
            assistantDiv.textContent += data.text;
            scrollChat();
          }
        } catch (_) {}
      }
    }
  } catch (err) {
    assistantDiv.textContent = 'Error: ' + err.message;
  }

  btn.disabled = false;
  input.focus();
  await loadConversations();
}

document.getElementById('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ── Init ───────────────────────────────────────────
loadTasks();
loadConversations();
</script>

<script type="module">
import { Relay } from '/static/relay.js'

const relay = new Relay()

relay
  .register({
    name: 'log',
    description: 'Output a message to the console panel. Use this to show your reasoning, progress, or any notes while working.',
    params: {
      message: { type: 'string', description: 'Message to display in the console' }
    },
    fn: ({ message }) => appendToConsole(message)
  })
  .register({
    name: 'refresh_task_list',
    description: 'Reload the task list from the server so the UI shows the latest tasks. Call this after adding or deleting tasks.',
    params: {},
    fn: async () => { await loadTasks() }
  })
  .connect()
</script>
