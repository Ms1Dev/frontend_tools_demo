{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      gap: 16px;
      padding: 16px;
      height: 100vh;
    }

    .panel {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
    }

    .panel-header {
      padding: 16px 20px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 15px;
      font-weight: 600;
      color: #111827;
      flex-shrink: 0;
    }

    /* ── Task list ─────────────────────────── */
    .task-add {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid #e5e7eb;
      flex-shrink: 0;
    }

    .task-add input {
      flex: 1;
      padding: 7px 11px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }

    .task-add input:focus { border-color: #6366f1; }

    .task-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      transition: background 0.1s;
    }

    .task-item:hover { background: #f9fafb; }
    .task-item.drag-over { background: #eef2ff; border-top: 2px solid #6366f1; }

    .drag-handle {
      color: #c4c9d4;
      cursor: grab;
      font-size: 16px;
      line-height: 1;
      user-select: none;
      flex-shrink: 0;
    }

    .drag-handle:active { cursor: grabbing; }

    .task-title {
      flex: 1;
      font-size: 14px;
      color: #374151;
    }

    .task-title-input {
      flex: 1;
      font-size: 14px;
      padding: 2px 7px;
      border: 1px solid #6366f1;
      border-radius: 4px;
      outline: none;
      font-family: inherit;
    }

    .task-actions { display: flex; gap: 2px; flex-shrink: 0; }

    /* ── Chat panel ────────────────────────── */
    .chat-panel {
      flex: 1.5;
      flex-direction: row;
      gap: 0;
    }

    /* ── Conversations sidebar ─────────────── */
    .convos-sidebar {
      width: 168px;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .convos-header {
      padding: 14px 12px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 13px;
      font-weight: 600;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .convos-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }

    .convo-item {
      padding: 8px 12px;
      font-size: 13px;
      color: #374151;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.1s;
    }

    .convo-item:hover { background: #f9fafb; }
    .convo-item.active { background: #eef2ff; color: #4338ca; font-weight: 500; }

    /* ── Main chat area ────────────────────── */
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 78%;
      padding: 9px 13px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background: #6366f1;
      color: #fff;
      border-bottom-right-radius: 3px;
    }

    .message.assistant {
      align-self: flex-start;
      background: #f3f4f6;
      color: #111827;
      border-bottom-left-radius: 3px;
    }

    .chat-input-row {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid #e5e7eb;
      flex-shrink: 0;
    }

    .chat-input {
      flex: 1;
      padding: 8px 11px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      resize: none;
      outline: none;
      font-family: inherit;
      line-height: 1.4;
    }

    .chat-input:focus { border-color: #6366f1; }

    /* ── Buttons ───────────────────────────── */
    .btn {
      padding: 7px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      transition: opacity 0.15s, background 0.15s;
    }

    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: #6366f1; color: #fff; }
    .btn-primary:not(:disabled):hover { background: #4f46e5; }
    .btn-icon {
      background: transparent;
      color: #9ca3af;
      padding: 4px 6px;
      border-radius: 5px;
    }
    .btn-icon:hover { background: #f3f4f6; color: #374151; }
    .btn-icon.danger:hover { background: #fef2f2; color: #ef4444; }
    .btn-new {
      background: transparent;
      border: none;
      cursor: pointer;
      color: #6366f1;
      font-size: 18px;
      line-height: 1;
      padding: 0 2px;
      border-radius: 4px;
    }
    .btn-new:hover { background: #eef2ff; }
  </style>
</head>
<body>
{% csrf_token %}

<div class="app">

  <!-- ── Task list ──────────────────────────────── -->
  <div class="panel">
    <div class="panel-header">Tasks</div>
    <div class="task-add">
      <input type="text" id="new-task-input" placeholder="Add a task…" autocomplete="off">
      <button class="btn btn-primary" onclick="addTask()">Add</button>
    </div>
    <div class="task-list" id="task-list"></div>
  </div>

  <!-- ── Chat ──────────────────────────────────── -->
  <div class="panel chat-panel">

    <!-- Conversations sidebar -->
    <div class="convos-sidebar">
      <div class="convos-header">
        Chats
        <button class="btn-new" title="New chat" onclick="newConversation()">+</button>
      </div>
      <div class="convos-list" id="convos-list"></div>
    </div>

    <!-- Main chat -->
    <div class="chat-main">
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-row">
        <textarea class="chat-input" id="chat-input" placeholder="Type a message…" rows="2"></textarea>
        <button class="btn btn-primary" id="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>

  </div>

</div>

<script>
// ── CSRF ───────────────────────────────────────────
const CSRF = document.querySelector('[name=csrfmiddlewaretoken]').value;

function api(url, method = 'GET', body = null) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF },
  };
  if (body !== null) opts.body = JSON.stringify(body);
  return fetch(url, opts).then(r => r.json());
}

// ── Helpers ────────────────────────────────────────
function esc(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── Tasks ──────────────────────────────────────────
let tasks = [];

async function loadTasks() {
  const data = await api('/api/tasks/');
  tasks = data.tasks;
  renderTasks();
}

function renderTasks() {
  const list = document.getElementById('task-list');
  list.innerHTML = '';
  tasks.sort((a, b) => a.order - b.order || a.id - b.id);
  tasks.forEach(task => {
    const item = document.createElement('div');
    item.className = 'task-item';
    item.dataset.id = task.id;
    item.draggable = true;
    item.innerHTML = `
      <span class="drag-handle" title="Drag to reorder">⠿</span>
      <span class="task-title">${esc(task.title)}</span>
      <div class="task-actions">
        <button class="btn btn-icon" title="Edit" onclick="startEdit(${task.id})">✎</button>
        <button class="btn btn-icon danger" title="Delete" onclick="deleteTask(${task.id})">✕</button>
      </div>`;
    attachDragEvents(item);
    list.appendChild(item);
  });
}

async function addTask() {
  const input = document.getElementById('new-task-input');
  const title = input.value.trim();
  if (!title) return;
  const task = await api('/api/tasks/add/', 'POST', { title });
  if (task.error) return;
  tasks.push(task);
  renderTasks();
  input.value = '';
}

document.getElementById('new-task-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTask();
});

function startEdit(id) {
  const item = document.querySelector(`.task-item[data-id="${id}"]`);
  const task = tasks.find(t => t.id === id);
  const titleSpan = item.querySelector('.task-title');
  const input = document.createElement('input');
  input.className = 'task-title-input';
  input.value = task.title;
  titleSpan.replaceWith(input);
  input.focus();
  input.select();

  let committed = false;
  const commit = async () => {
    if (committed) return;
    committed = true;
    const newTitle = input.value.trim();
    if (!newTitle || newTitle === task.title) { renderTasks(); return; }
    const updated = await api(`/api/tasks/${id}/edit/`, 'POST', { title: newTitle });
    if (!updated.error) task.title = updated.title;
    renderTasks();
  };

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') commit();
    if (e.key === 'Escape') { committed = true; renderTasks(); }
  });
  input.addEventListener('blur', commit);
}

async function deleteTask(id) {
  await api(`/api/tasks/${id}/delete/`, 'POST');
  tasks = tasks.filter(t => t.id !== id);
  renderTasks();
}

// ── Drag & Drop ────────────────────────────────────
let dragSrcId = null;

function attachDragEvents(item) {
  item.addEventListener('dragstart', e => {
    dragSrcId = parseInt(item.dataset.id);
    e.dataTransfer.effectAllowed = 'move';
  });

  item.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.task-item').forEach(el => el.classList.remove('drag-over'));
    item.classList.add('drag-over');
  });

  item.addEventListener('dragleave', () => item.classList.remove('drag-over'));

  item.addEventListener('drop', async e => {
    e.preventDefault();
    item.classList.remove('drag-over');
    const dropId = parseInt(item.dataset.id);
    if (dragSrcId === dropId) return;

    const srcIdx = tasks.findIndex(t => t.id === dragSrcId);
    const dstIdx = tasks.findIndex(t => t.id === dropId);
    const [moved] = tasks.splice(srcIdx, 1);
    tasks.splice(dstIdx, 0, moved);
    tasks.forEach((t, i) => t.order = i + 1);

    renderTasks();
    await api('/api/tasks/reorder/', 'POST', tasks.map(t => ({ id: t.id, order: t.order })));
  });

  item.addEventListener('dragend', () => {
    document.querySelectorAll('.task-item').forEach(el => el.classList.remove('drag-over'));
  });
}

// ── Conversations ───────────────────────────────────
let conversations = [];
let currentConversationId = null;

async function loadConversations() {
  const data = await api('/api/conversations/');
  conversations = data.conversations;
  renderConversations();
}

function renderConversations() {
  const list = document.getElementById('convos-list');
  list.innerHTML = '';
  conversations.forEach(c => {
    const item = document.createElement('div');
    item.className = 'convo-item' + (c.id === currentConversationId ? ' active' : '');
    item.dataset.id = c.id;
    item.textContent = c.title;
    item.title = c.title;
    item.onclick = () => selectConversation(c.id);
    list.appendChild(item);
  });
}

async function selectConversation(id) {
  currentConversationId = id;
  renderConversations();
  const data = await api(`/api/conversations/${id}/messages/`);
  const msgs = document.getElementById('chat-messages');
  msgs.innerHTML = '';
  data.messages.forEach(m => appendMessage(m.role, m.content));
}

function newConversation() {
  currentConversationId = null;
  document.getElementById('chat-messages').innerHTML = '';
  renderConversations();
  document.getElementById('chat-input').focus();
}

// ── Chat ───────────────────────────────────────────
function appendMessage(role, text) {
  const div = document.createElement('div');
  div.className = `message ${role}`;
  div.textContent = text;
  document.getElementById('chat-messages').appendChild(div);
  scrollChat();
  return div;
}

function scrollChat() {
  const msgs = document.getElementById('chat-messages');
  msgs.scrollTop = msgs.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const btn = document.getElementById('send-btn');
  const message = input.value.trim();
  if (!message || btn.disabled) return;

  input.value = '';
  btn.disabled = true;

  appendMessage('user', message);
  const assistantDiv = appendMessage('assistant', '');

  try {
    const body = { message };
    if (currentConversationId) body.conversation_id = currentConversationId;

    const response = await fetch('/api/chat/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF },
      body: JSON.stringify(body),
    });

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6);
        if (payload === '[DONE]') break;
        try {
          const data = JSON.parse(payload);
          if (data.conversation_id) {
            currentConversationId = data.conversation_id;
          }
          if (data.text) {
            assistantDiv.textContent += data.text;
            scrollChat();
          }
        } catch (_) {}
      }
    }
  } catch (err) {
    assistantDiv.textContent = 'Error: ' + err.message;
  }

  btn.disabled = false;
  input.focus();
  await loadConversations();
}

document.getElementById('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ── Init ───────────────────────────────────────────
loadTasks();
loadConversations();
</script>
</body>
</html>
