{% extends "tasks/base.html" %}
{% load static %}

{% block content %}

<div class="app">

  <!-- ── Task list ──────────────────────────────── -->
  {% include "tasks/partials/task_panel.html" %}

  <!-- ── Chat ──────────────────────────────────── -->
  <div class="panel chat-panel">

    <!-- Conversations sidebar -->
    <div class="convos-sidebar">
      <div class="convos-header">
        Chats
        <button class="btn-new" id="new-convo-btn" title="New chat">+</button>
      </div>
      <div class="convos-list" id="convos-list"></div>
    </div>

    <!-- Main chat -->
    <div class="chat-main">
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-row">
        <textarea class="chat-input" id="chat-input" placeholder="Type a message…" rows="2"></textarea>
        <button class="btn btn-primary" id="send-btn">Send</button>
      </div>
    </div>

  </div>

</div>

<!-- ── Console ──────────────────────────────────────── -->
<div class="console-panel collapsed" id="console-panel">
  <div class="console-header" id="console-header">
    <div class="console-header-left">
      <span>LLM Console</span>
      <span class="console-badge" id="console-badge">0</span>
    </div>
    <button class="console-toggle" id="console-toggle" title="Toggle console">▲</button>
  </div>
  <div class="console-body" id="console-body">
    <span class="console-empty">No messages yet.</span>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script type="module" src="{% static 'tasks/chat.js' %}"></script>

<script type="module">
import { api, esc } from '{% static "tasks/utils.js" %}';
import { Relay } from '/static/relay.js';

// ── Dark mode ───────────────────────────────────────
function setDark(dark) {
  document.body.classList.toggle('dark', dark);
  document.getElementById('dark-toggle').textContent = dark ? '☀' : '☽';
  localStorage.setItem('dark', dark ? '1' : '');
}

function toggleDark() { setDark(!document.body.classList.contains('dark')); }

if (localStorage.getItem('dark')) setDark(true);
document.getElementById('dark-toggle').addEventListener('click', toggleDark);

// ── Console ─────────────────────────────────────────
let consoleUnread = 0;

function appendToConsole(message) {
  const body = document.getElementById('console-body');
  const empty = body.querySelector('.console-empty');
  if (empty) empty.remove();

  const now = new Date();
  const ts = now.toTimeString().slice(0, 8);
  const line = document.createElement('div');
  line.className = 'console-line';
  line.innerHTML = `<span class="console-ts">${ts}</span><span class="console-msg">${esc(message)}</span>`;
  body.appendChild(line);
  body.scrollTop = body.scrollHeight;

  const panel = document.getElementById('console-panel');
  if (panel.classList.contains('collapsed')) {
    consoleUnread++;
    const badge = document.getElementById('console-badge');
    badge.textContent = consoleUnread;
    badge.classList.add('visible');
  }
}

function toggleConsole() {
  const panel = document.getElementById('console-panel');
  const btn = document.getElementById('console-toggle');
  const collapsed = panel.classList.toggle('collapsed');
  btn.textContent = collapsed ? '▲' : '▼';
  if (!collapsed) {
    consoleUnread = 0;
    const badge = document.getElementById('console-badge');
    badge.textContent = '0';
    badge.classList.remove('visible');
    document.getElementById('console-body').scrollTop = document.getElementById('console-body').scrollHeight;
  }
}

document.getElementById('console-header').addEventListener('click', toggleConsole);

// ── Tasks ──────────────────────────────────────────
let tasks = [];

async function loadTasks() {
  const data = await api('/api/tasks/');
  tasks = data.tasks;
  renderTasks();
}

function renderTasks() {
  const list = document.getElementById('task-list');
  list.innerHTML = '';
  tasks.forEach(task => {
    const item = document.createElement('div');
    item.className = 'task-item';
    item.dataset.id = task.id;
    item.innerHTML = `
      <span class="task-title">${esc(task.title)}</span>
      <div class="task-actions">
        <button class="btn btn-icon" title="Edit" data-action="edit">✎</button>
        <button class="btn btn-icon danger" title="Delete" data-action="delete">✕</button>
      </div>`;
    list.appendChild(item);
  });
}

async function addTask() {
  const input = document.getElementById('new-task-input');
  const title = input.value.trim();
  if (!title) return;
  const task = await api('/api/tasks/add/', 'POST', { title });
  if (task.error) return;
  tasks.push(task);
  renderTasks();
  input.value = '';
}

function initTaskPanel() {
  const input = document.getElementById('new-task-input');
  if (!input) return;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
  document.getElementById('add-task-btn').addEventListener('click', addTask);
  document.getElementById('task-list').addEventListener('click', e => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const id = parseInt(btn.closest('.task-item').dataset.id);
    if (btn.dataset.action === 'edit') startEdit(id);
    if (btn.dataset.action === 'delete') deleteTask(id);
  });
  loadTasks();
}

// ── Map ─────────────────────────────────────────────
let map = null;

function initMap() {
  map = L.map('map-container').setView([51.505, -0.09], 13);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 20,
  }).addTo(map);
}

document.addEventListener('htmx:afterSwap', () => {
  if (document.getElementById('task-list')) initTaskPanel();
  if (document.getElementById('map-container')) { map = null; initMap(); }
  else map = null;
});

initTaskPanel();

function startEdit(id) {
  const item = document.querySelector(`.task-item[data-id="${id}"]`);
  const task = tasks.find(t => t.id === id);
  const titleSpan = item.querySelector('.task-title');
  const input = document.createElement('input');
  input.className = 'task-title-input';
  input.value = task.title;
  titleSpan.replaceWith(input);
  input.focus();
  input.select();

  let committed = false;
  const commit = async () => {
    if (committed) return;
    committed = true;
    const newTitle = input.value.trim();
    if (!newTitle || newTitle === task.title) { renderTasks(); return; }
    const updated = await api(`/api/tasks/${id}/edit/`, 'POST', { title: newTitle });
    if (!updated.error) task.title = updated.title;
    renderTasks();
  };

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') commit();
    if (e.key === 'Escape') { committed = true; renderTasks(); }
  });
  input.addEventListener('blur', commit);
}

async function deleteTask(id) {
  await api(`/api/tasks/${id}/delete/`, 'POST');
  tasks = tasks.filter(t => t.id !== id);
  renderTasks();
}


// ── Relay ────────────────────────────────────────────
//
// Tools are registered here. On each message, schemas
// (name, description, params) are sent to the LLM so
// it knows what it can call. The fn stays in the
// browser and runs when the LLM calls the tool.
//
// When the LLM calls one of these tools it transmits the 
// name and arguments to the browser using SSE. 
// The browser receives the event and executes the fn. 
// (see relay/static/relay.js)
//
// ─────────────────────────────────────────────────────
window._relay = new Relay()
  .registerHtmxTriggers([
    { name: 'swap-to-map',   description: 'Switch the left panel to the map view' },
    { name: 'swap-to-tasks', description: 'Switch the left panel back to the task list' },
  ])
  .register({
    name: 'log',
    description: 'Output a short message to the developer console panel in the UI. Use this to narrate what you are doing.',
    params: { message: { type: 'string', description: 'Message to display in the console' } },
    fn: ({ message }) => appendToConsole(message),
  })
  .register({
    name: 'refresh_task_list',
    description: 'Reload the task list from the server so the UI reflects the latest data. Call this after any add or delete.',
    params: {},
    fn: () => loadTasks(),
  })
  .register({
    name: 'set_dark_mode',
    description: 'Enable or disable dark mode.',
    params: { dark: { type: 'boolean', description: 'True to enable dark mode, false to disable' } },
    fn: ({ dark }) => setDark(dark),
  })
  .register({
    name: 'go_to_coordinates',
    description: 'Pan and zoom the map to a specific location.',
    params: {
      lat:  { type: 'number', description: 'Latitude' },
      lng:  { type: 'number', description: 'Longitude' },
      zoom: { type: 'number', description: 'Zoom level (default 14)' },
    },
    fn: ({ lat, lng, zoom = 14 }) => map?.flyTo([lat, lng], zoom),
  })
  .register({
    name: 'drop_pin',
    description: 'Drop a marker on the map at a given location with an optional label.',
    params: {
      lat:   { type: 'number', description: 'Latitude' },
      lng:   { type: 'number', description: 'Longitude' },
      label: { type: 'string', description: 'Popup label shown on the marker (optional)' },
    },
    fn: ({ lat, lng, label = '' }) => {
      if (!map) return
      const marker = L.marker([lat, lng]).addTo(map)
      if (label) marker.bindPopup(label).openPopup()
      map.flyTo([lat, lng], 14)
    },
  })
  .connect()

</script>
{% endblock %}
