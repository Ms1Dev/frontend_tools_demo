<div class="panel task-panel" id="task-panel">
  <div class="panel-header">
    <span id="task-panel-title">Tasks</span>
    <button class="btn-icon" title="Switch to map"
            hx-get="/panels/map/" hx-target="#task-panel" hx-swap="outerHTML"
            hx-trigger="click, swap-to-map"
            data-trigger="swap-to-map">Map</button>
  </div>
  <div class="task-add">
    <input type="text" id="new-task-input" placeholder="Add a task…" autocomplete="off">
    <button class="btn btn-primary" id="add-task-btn">Add</button>
  </div>
  <div class="task-list" id="task-list"></div>
</div>
